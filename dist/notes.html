<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVS I Basic ECG &amp; ECG Lab &#183; Peer support 82 (Tutor)</title>
<meta name="description" content="Question-first peer-tutoring deck: CVS I basic ECG lecture (TBL) and ECG lab, with AC75–81 past-paper questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  /* Layout: a lab-bench stage. One large card at a time on chart-recorder paper, a strip of eight lab stations above, a sticky pager below. Browse = one scrolling worksheet. */
  --paper: #f3f5f8;      /* page ground, cool grey */
  --sheet: #ffffff;      /* card */
  --sheet2: #edf0f5;     /* inset panels */
  --ink: #19202e;        /* text */
  --ink2: #4f5a6e;       /* secondary text */
  --rule: #d4dae4;       /* hairlines */
  --grid: #e9edf3;       /* chart-paper grid */
  --art: #ae1530;        /* arterial red: brand, tracings */
  --art-soft: #fbe5e9;
  --ven: #1f4f97;        /* venous blue: controls, second tracing */
  --ven-soft: #e2ebf8;
  --ok: #13744a; --ok-soft: #dff2e7;
  --bad: #b02f19; --bad-soft: #fbe6df;
  --warn: #775100; --warn-soft: #fbefd2;
  --scanbg: #ffffff;     /* paper behind real figures */
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
    --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
    --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
  --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
  --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ven); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- cards ---------- */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(16px, 2.6vw, 34px); min-width: 0; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.eyebrow .id { font-weight: 600; color: var(--art); font-size: 1.12em; letter-spacing: .02em; }
.chip { border-radius: 999px; padding: 2px 9px; background: var(--sheet2); color: var(--ink2); white-space: nowrap; }
.chip.core { background: var(--art-soft); color: var(--art); }
.chip.kind { background: var(--ven-soft); color: var(--ven); }
.chip.grp { background: transparent; border: 1px dashed var(--rule); }
.concept h2, .secard h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.6em; line-height: 1.2; margin: 0 0 14px; text-wrap: balance; letter-spacing: .005em; }
.cbody { display: grid; gap: 16px; }
.cbody > * { min-width: 0; }
.muted { color: var(--ink2); font-weight: 400; }

/* ---------- question cards ---------- */
.stem { font-size: 1.26em; font-weight: 500; line-height: 1.45; margin: 2px 0 16px; text-wrap: pretty; }
.stem b { color: var(--art); font-weight: 600; }
.stem .muted { font-size: .82em; display: block; margin-top: 4px; }
.qfig { margin: 0 0 16px; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.opt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: .6em .85em; cursor: pointer; transition: border-color .15s, background-color .15s, opacity .15s; line-height: 1.4; }
.opt:hover { border-color: var(--ven); }
.opt .L { font: 600 .88em var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--rule); color: var(--ink2); }
.opt .mk { font-weight: 700; min-width: 1em; }
.opt.sel { border-color: var(--ven); background: var(--ven-soft); }
.opt.sel .L { border-color: var(--ven); color: var(--ven); }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { padding: .9em 1em; font-size: 1.08em; font-weight: 500; }
.rev .opt { cursor: default; }
.rev .opt.isans, .showall .opt.isans { border-color: var(--ok); background: var(--ok-soft); }
.rev .opt.isans .L, .showall .opt.isans .L { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rev .opt.isans .mk::after, .showall .opt.isans .mk::after { content: "\2713"; color: var(--ok); }
.rev .opt.sel:not(.isans) { border-color: var(--bad); background: var(--bad-soft); }
.rev .opt.sel:not(.isans) .L { border-color: var(--bad); color: var(--bad); }
.rev .opt.sel:not(.isans) .mk::after { content: "\2717"; color: var(--bad); }
.rev .opt:not(.isans):not(.sel) { opacity: .55; }
.think { margin: 0; color: var(--ink2); font-style: italic; }
.explain { margin-top: 16px; background: var(--ok-soft); border-radius: 12px; padding: 14px 18px; }
.qcard:not(.rev) .explain { display: none; }
.showall .qcard .explain { display: block; }
.explain .ans { font: 600 1.02em var(--f-display); color: var(--ok); margin-bottom: 4px; }
.explain p { margin: 0; }
.flag { margin-top: 10px; background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; font-size: .9em; }
.flag b { color: var(--warn); }

/* ---------- concept building blocks ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.figpair { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); align-items: center; }
@media (max-width: 760px) { .two, .cols2, .cols3, .figpair { grid-template-columns: 1fr; } }
.mini { background: var(--sheet2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.mini h4 { margin: 0 0 6px; font: 600 1em var(--f-display); letter-spacing: .01em; }
.mini.art h4 { color: var(--art); }
.mini.ven h4 { color: var(--ven); }
.mini p { margin: 0; }
.mini ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; }
.steps.tight { gap: 3px; }
.note { margin: 0; background: var(--ven-soft); border-radius: 10px; padding: 10px 14px; }
.trap { margin: 0; background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.trap::before { content: "Exam trap \00B7  "; font-weight: 600; color: var(--warn); }
.eqn { font: 600 1.65em var(--f-display); text-align: center; letter-spacing: .02em; padding: 6px 0; }
.eqn span { color: var(--art); }
.speeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .speeds { grid-template-columns: 1fr; } }
.speed { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sheet); }
.sp-h { display: grid; gap: 2px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--rule); }
.sp-h .mono { font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.s1 .sp-h b { color: var(--art); }
.s2 .sp-h b { color: var(--warn); }
.s3 .sp-h b { color: var(--ven); }
.speed ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow.col { flex-direction: column; align-items: stretch; }
.fbox { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 12px; flex: 1 1 140px; min-width: 0; }
.fbox.start { background: var(--sheet2); }
.fbox.end { background: var(--ok-soft); border-color: var(--ok); }
.fbox.art { background: var(--art-soft); border-color: var(--art); }
.fbox.ven { background: var(--ven-soft); border-color: var(--ven); }
.farrow { color: var(--ink2); font-weight: 600; flex: none; text-align: center; }
.flow.col .farrow { font-size: .9em; }
.fstack { display: grid; gap: 8px; flex: 2 1 260px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } }
.cycle { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.cycle .ph { flex: 1 1 130px; background: var(--sheet2); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .92em; display: grid; gap: 2px; align-content: start; }
.cycle .ph span { font-weight: 400; color: var(--ink2); font-size: .88em; }
.cycle .sd { flex: none; align-self: center; font: 700 .9em var(--f-mono); color: var(--sheet); background: var(--ink); border-radius: 999px; padding: 4px 10px; }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl caption { text-align: left; font: 600 .95em var(--f-display); padding-bottom: 6px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl thead th { font-family: var(--f-mono); font-size: .76em; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); background: var(--sheet2); }
.tbl td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); white-space: nowrap; }
.tbl .up { color: var(--art); font-weight: 600; }
.tbl .dn { color: var(--ven); font-weight: 600; }
.tbl thead th.up { color: var(--art); }
.tbl thead th.dn { color: var(--ven); }
.tbl.compact th, .tbl.compact td { padding: 4px 8px; }
.dogtbl td:nth-child(2), .dogtbl td:nth-child(3), .dogtbl td:nth-child(4) { text-align: center; white-space: nowrap; }

/* ---------- real figures cropped from the course material ---------- */
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.scan { margin: 0; min-width: 0; display: grid; gap: 6px; align-content: start; }
.paperimg { background: var(--scanbg); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; isolation: isolate; }
.scan img { display: block; width: auto; max-width: 100%; height: auto; max-height: min(440px, 62vh); margin: 0 auto; mix-blend-mode: multiply; cursor: zoom-in; border-radius: 4px; }
.scan.tall img { max-height: min(480px, 66vh); }
.scanrow .scan img { max-height: 360px; }
.scan figcaption { font-size: .84em; line-height: 1.4; color: var(--ink2); text-wrap: pretty; }
.scan figcaption .src { font-family: var(--f-mono); font-size: .88em; white-space: nowrap; opacity: .9; }
.scan figcaption .src::before { content: "\00B7  "; }
.scan figcaption.srconly .src::before { content: none; }
.scanrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; align-items: start; min-width: 0; }
.qfig .scan { max-width: 760px; }
.qfig .scan.tall { max-width: 560px; }

/* ---------- cloze blanks: {{key detail}} in concept cards ---------- */
.cz { border-radius: 4px; padding: 0 .22em; background: var(--sheet2); color: transparent; box-shadow: inset 0 -2px 0 var(--art); cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: color .18s, background-color .18s; }
.cz * { color: transparent !important; }
.cz:hover { background: var(--art-soft); }
.cz.on, .czopen .cz, .showall .cz { color: inherit; background: var(--art-soft); }
.cz.on *, .czopen .cz *, .showall .cz * { color: inherit !important; }
.cz.last { animation: czpop .5s ease-out; }
@keyframes czpop { 0% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 4px var(--art-soft); } 100% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 0 transparent; } }
@media print { .cz { color: inherit; background: none; } .cz * { color: inherit !important; } }

/* ---------- figure zoom ---------- */
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 12, .88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom .zbox { display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.zoom .zpaper { background: #fff; border-radius: 10px; padding: 10px; max-width: min(1700px, 100%); }
.zoom img { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; }
.zoom .zcap { color: #e5e8ef; font-size: .92em; text-align: center; max-width: 900px; margin: 0; }

/* Thai explanation under each concept card (student deck: collapsible; tutor deck: open) */
.thx { margin-top: 16px; border: 1px solid var(--rule); border-left: 3px solid var(--ok); border-radius: 10px; background: var(--sheet); padding: 0 14px; }
.thx summary { cursor: pointer; padding: 10px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.thx summary::marker, .thx summary::-webkit-details-marker { color: var(--ok); }
.thx-h { font: 600 1.02em var(--f-display); color: var(--ok); }
.thx-s { font: .74em var(--f-mono); color: var(--ink2); }
.thx[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.thx-body { display: grid; gap: 9px; padding-bottom: 14px; line-height: 1.7; font-family: "IBM Plex Sans Thai", var(--f-body); }
.thx-body p { margin: 0; }
ul.thx-body { margin: 0; padding: 0 0 14px 1.2em; gap: 6px; }
ul.thx-body li::marker { color: var(--ok); }
.thx-body b { font-weight: 600; color: var(--ink); }

/* cover: counts + QR to the live deck (student deck start card and PDF cover) */
.coverline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin: 4px 0 22px; padding: 14px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts { display: flex; gap: 44px; }
.counts > div { display: grid; }
.counts b { font: 600 3.2em/1 var(--f-display); letter-spacing: -.01em; }
.counts span { font: .8em var(--f-mono); color: var(--ink2); letter-spacing: .04em; margin-top: 5px; }
.qrlink { display: grid; justify-items: end; gap: 6px; color: var(--ink2); text-decoration: none; }
.qrlink img { width: 112px; height: 112px; display: block; }
.qrlink span { font: .72em var(--f-mono); }
.qrlink .qrcap { font: 600 .78em var(--f-display); color: var(--ink); letter-spacing: .01em; }
.qrlink:hover span { color: var(--ven); text-decoration: underline; }
.legend { margin: 14px 0 0; font: .8em var(--f-mono); color: var(--ink2); }
.legend .chip { margin-right: 6px; }
@media (max-width: 560px) { .qrlink img, .qrlink .qrcap { display: none; } .qrlink { justify-items: start; } .counts b { font-size: 2.6em; } }

/* figure that would give away a card's blanks: collapsed behind a summary (closed in the PDF) */
.figans { border: 1px dashed var(--rule); border-radius: 10px; padding: 8px 12px; }
.figans summary { cursor: pointer; font: 500 .85em var(--f-mono); color: var(--ink2); }
.figans[open] summary { margin-bottom: 8px; }

/* long source chips wrap instead of widening the card on phones */
.eyebrow .chip { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
/* short concept cards (data/lite.js): arrow chains and brief bullets */
.lt { display: grid; gap: 10px; align-content: start; }
.lt-two { align-items: start; }
.lt-figs { display: grid; gap: 12px; }
.lt-chain { margin: 0; padding: 8px 12px; background: var(--sheet2); border-radius: 8px; line-height: 1.65; font-weight: 500; }
.lt-ar { color: var(--art); font-weight: 700; padding: 0 .12em; }
.lt-pts { margin: 0; padding-left: 1.15em; display: grid; gap: 4px; line-height: 1.5; }
.lt-h { margin: 4px 0 -4px; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.lt-trap { margin: 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 8px; padding: 6px 10px; font-size: .95em; }
.lt-p { margin: 0; }
.lt-tbl { width: 100%; border-collapse: collapse; font-size: .95em; }
.lt-tbl th { text-align: left; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); border-bottom: 1.5px solid var(--rule); padding: 4px 8px; }
.lt-tbl td { border-bottom: 1px solid var(--rule); padding: 5px 8px; vertical-align: top; }
.lt .eqn { font-size: 1.15em; padding: 2px 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--sheet); border-bottom: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 18px; align-items: center; }
@media (max-width: 1020px) { .bar { grid-template-columns: minmax(0, 1fr) auto; } .tabs { grid-column: 1 / -1; order: 3; } }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand svg { flex: none; width: 38px; height: 22px; }
.brand b { display: block; font: 600 1.05rem var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.brand small { display: block; color: var(--ink2); font: .72rem var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding-block: 2px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink2); border-radius: 999px; padding: 5px 12px; font-size: .84rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { border-color: var(--ven); color: var(--ink); }
.tab .k { font-family: var(--f-mono); color: var(--art); margin-right: 6px; font-weight: 600; }
.tab[aria-current="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tab[aria-current="true"] .k { color: var(--art-soft); }
.ctrls { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.decklink { border: 1px solid var(--art); background: var(--art-soft); color: var(--art); border-radius: 8px; padding: 5px 10px; font-size: .82rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
.decklink:hover { background: var(--art); color: var(--sheet); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: 6px 11px; font-size: .85rem; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ven); color: var(--sheet); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--ink2); cursor: pointer; user-select: none; white-space: nowrap; }
.chk input { accent-color: var(--art); width: 16px; height: 16px; margin: 0; }
.icon { display: inline-grid; place-items: center; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 8px; height: 32px; width: 34px; padding: 0; cursor: pointer; }
.icon svg { width: 16px; height: 16px; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 0; }
#present { max-width: 1180px; margin: 0 auto; }
#present .card { font-size: clamp(15px, .5vw + 11.5px, 20px); }
.stage { min-height: 55vh; }
.eyebrow .sp { flex: 1; }
.pager { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; background: var(--paper); padding-block: 12px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 14px; border-top: 1px solid var(--rule); }
.pos { font-family: var(--f-mono); font-size: .82rem; color: var(--ink2); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos span { color: var(--art); font-weight: 600; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-size: .95rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ven); }
.btn.primary { background: var(--art); color: var(--sheet); border-color: var(--art); min-width: 7em; }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn:disabled { opacity: .4; cursor: default; }
.prog { grid-column: 1 / -1; height: 3px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--art); width: 0; transition: width .2s; }
.keys { grid-column: 1 / -1; font: .72rem var(--f-mono); color: var(--ink2); text-align: center; }
@media (max-width: 560px) { .keys { display: none; } }

/* intro and section cards */
.secard .lede { font-size: 1.05em; color: var(--ink2); margin: 0 0 14px; max-width: 70ch; line-height: 1.55; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 26px; font-family: var(--f-mono); font-size: .82em; color: var(--ink2); margin-bottom: 16px; }
.stats b { font: 600 1.7em var(--f-display); color: var(--ink); display: block; line-height: 1.1; }
.minih { font: 600 .8em var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); margin: 14px 0 8px; }
.toc { margin: 0; padding-left: 0; list-style: none; columns: 2 280px; column-gap: 28px; }
.toc li { break-inside: avoid; margin-bottom: 5px; }
.toc .tid { font-family: var(--f-mono); color: var(--art); font-size: .85em; margin-right: 8px; }
.stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 4px 0 16px; }
.station { text-align: left; border: 1px solid var(--rule); background: var(--sheet2); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.station:hover { border-color: var(--ven); }
.station .k { font: 600 .78rem var(--f-mono); color: var(--art); }
.station b { font: 600 1.05rem var(--f-display); }
.station span:last-child { color: var(--ink2); font-size: .86rem; }

/* tutor bullet explanations & concept key points */
.ex-list { margin: 6px 0 0; padding-left: 1.25em; display: grid; gap: 5px; line-height: 1.55; }
.ex-list li::marker { color: var(--ok); }
.tpoints { margin-bottom: 14px; background: var(--ven-soft); border-left: 3px solid var(--ven); border-radius: 10px; padding: 10px 14px; }
.tpoints .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ven); margin-bottom: 4px; }
.tpoints ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }
.traps-box { margin: 12px 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 10px; padding: 10px 14px; }
.traps-box .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--warn); margin-bottom: 4px; }
.traps-box ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }

/* browse */
#browse { max-width: 1000px; margin: 0 auto; padding-bottom: 48px; }
.btools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 4px 6px; }
.btools input[type="search"] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
.bcount { font: .8rem var(--f-mono); color: var(--ink2); }
.bsec { display: grid; gap: 14px; margin-top: 28px; }
.bsec > header { scroll-margin-top: 130px; }
.bsec > header h2 { font: 600 1.5rem var(--f-display); margin: 0; text-wrap: balance; }
.bsec > header p { margin: 4px 0 0; color: var(--ink2); }
.bsec > header .eyebrow { margin-bottom: 6px; }
#blist .card { font-size: 15px; scroll-margin-top: 130px; }
#blist .stem { font-size: 1.1em; }

/* recording script: SAY lines, 80% summary, video plan */
.saybox { margin: 12px 0 0; background: var(--sheet2); border-left: 3px solid var(--art); border-radius: 10px; padding: 10px 14px; }
.concept .saybox, .secard .saybox { margin: 0 0 14px; }
.saybox .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--art); margin-bottom: 4px; }
.saybox p { margin: 0; line-height: 1.55; }
.u80 { margin: 12px 0; border: 1px solid var(--rule); border-radius: 10px; padding: 0 14px; background: var(--sheet); }
.u80 summary { cursor: pointer; padding: 10px 0; font: 600 .95em var(--f-display); }
.u80 summary span { font: 400 .78em var(--f-mono); color: var(--ink2); margin-left: 8px; }
.u80[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.u80 ol { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 7px; line-height: 1.5; }
.plan td:nth-child(4) { min-width: 15em; }
.plan td:first-child { white-space: nowrap; font-weight: 600; }
/* phone: controls get their own row so the header never widens the page */
@media (max-width: 640px) { .bar { grid-template-columns: minmax(0, 1fr); position: relative; } .ctrls { justify-content: flex-start; } }
.brand > div { min-width: 0; }
.brand b { overflow: hidden; text-overflow: ellipsis; }

/* tutor-only teaching notes: knowledge beyond the slide (src/tutor-notes.js) */
.tnotes { margin: 12px 0; background: var(--art-soft); border-left: 3px solid var(--art); border-radius: 10px; padding: 10px 14px; }
.tn-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--art); margin-bottom: 4px; }
.tnotes ul { margin: 0; padding-left: 1.2em; display: grid; gap: 3px; line-height: 1.45; }
.tdiag { margin: 8px 0 0; padding: 8px 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; font: .8em/1.45 var(--f-mono); white-space: pre; overflow-x: auto; color: var(--ink); }

</style>

<script>
/* Shared registry for both pages (deck + tutor notes) and print.js.
   Concept-card HTML may mark key details as {{blanks}}: they render as click-to-reveal cloze spans.
   CVS.fig(name, caption, src, page[, cls]) builds a click-to-zoom course figure from img/<name>.jpg
   (sizes from data/figs.js); src is a key of CVS.SRC. Past-paper options keep their original order. */
window.CVS = {
  sections: [],
  dims: {},
  SRC: {
    lab: 'Lab Direction &#8211; ECG',
    ekg: 'Peer &#8211; EKG',
    heart: 'Peer &#8211; Physiology of the Heart',
    ac75: 'AC75&#8211;79 CVS',
    ac80: 'AC80 CVS1 MCQ',
    ac81: 'AC81 CVS MCQ'
  },
  cloze: function (h) { return String(h).replace(/\{\{([\s\S]*?)\}\}/g, '<span class="cz">$1</span>'); },
  fig: function (name, cap, src, page, cls) {
    var d = this.dims[name];
    if (!d) throw new Error('no image ' + name);
    var alt = String(cap).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
    return '<figure class="scan' + (cls ? ' ' + cls : '') + '"><div class="paperimg"><img src="img/' + name + '.jpg" width="' + d[0] + '" height="' + d[1] + '" alt="' + alt + '" loading="lazy" decoding="async"></div><figcaption>' + cap + ' <span class="src">' + this.SRC[src] + ', p.' + page + '</span></figcaption></figure>';
  },
  add: function (sec) {
    sec.items.forEach(function (it) { if (it.html) it.html = window.CVS.cloze(it.html); });
    this.sections.push(sec);
  }
};

/* Generated by tools/dims.sh from img/*.jpg. */
CVS.dims = {
  "ac76-axis": [628, 318],
  "ac78-axis": [624, 321],
  "ac78-rate": [560, 290],
  "ac80-ecg": [1420, 802],
  "ac81-ecg": [1280, 764],
  "ac81-rate": [1180, 368],
  "ir-axis-lad": [1680, 1132],
  "ir-axis-normal": [1640, 1005],
  "ir-rad-wide": [1680, 877],
  "ir-rate100": [1676, 665],
  "ir-rate168": [1670, 778],
  "ir-tachy-lad": [1580, 792],
  "lab-12leads": [1170, 438],
  "lab-electrodes": [1290, 891],
  "lab-readout": [1080, 1273],
  "lab-waves": [1200, 687],
  "peer-augmented": [230, 198],
  "peer-axis-wheel": [540, 317],
  "peer-bipolar": [240, 204],
  "peer-electrode": [380, 388],
  "peer-endoepi": [790, 515],
  "peer-hex3d": [837, 751],
  "peer-st-elev": [486, 560],
  "peer-swap": [720, 297],
  "peer-wiggers": [980, 792],
  "t68-af": [1386, 798],
  "t68-axisnormal": [1392, 702],
  "t68-dyspnea": [1390, 792],
  "t68-labels": [1368, 691],
  "t68-watch": [1312, 691],
  "t69-axis60": [1400, 549],
  "t69-brady": [1392, 758],
  "t69-mitral": [800, 509],
  "t69-prseg": [1320, 427],
  "t69-rate50": [1400, 872],
  "t69-table": [1388, 1033],
};

/* Section C: Cardiophysiology, how the ECG is made.
   Sources: Peer - EKG p.1-2 (tutor notes), Lab Direction - ECG p.1, ECG TBL t-RAT 2569 / 2568, i-RAT 266-66, AC77, AC80.
   {{text}} = cloze blank on concept cards. Past-paper stems and options keep their original wording and order. */
CVS.add({
  id: 'C', short: 'Cardiophysiology', title: 'Cardiophysiology: how the ECG is made', kind: 'Lecture',
  blurb: 'Dipoles and skin electrodes, which cells make which wave, why the T wave is upright, and where each action-potential phase sits on the tracing.',
  items: [
    { t: 'c', id: 'C-C1', title: 'What a skin electrode sees: the moving dipole', src: 'Peer – EKG p.1–2 · i-RAT 266-66',
      html: '<div class="two"><div class="stack">' +
        '<ul class="pts">' +
        '<li>A lead compares a <b>+ electrode</b> with a reference, so the ECG records a {{potential difference}} on the skin, never the voltage inside one cell.</li>' +
        '<li>Outside resting (polarized) myocytes the charge is <b>{{+}}</b>; outside depolarized myocytes it turns <b>{{−}}</b>.</li>' +
        '<li>While a wave travels, the border between the two zones is a <b>dipole</b>: the electrode over the depolarized zone is relatively {{negative}}, the one over still-resting tissue relatively + .</li>' +
        '<li>Muscle all at rest, or all depolarized: no difference, so the line stays {{flat (isoelectric)}}.</li>' +
        '</ul>' +
        '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Wave moving&#8230;</th><th>Depolarization</th><th>Repolarization</th></tr></thead><tbody>' +
        '<tr><td>toward the + electrode</td><td>{{upward}}</td><td>{{downward}}</td></tr>' +
        '<tr><td>away from the + electrode</td><td>{{downward (−)}}</td><td>{{upward (+)}}</td></tr>' +
        '<tr><td>at 90° to the lead</td><td colspan="2">{{biphasic}}: equal up and down</td></tr>' +
        '</tbody></table></div></div>' +
        CVS.fig('peer-electrode', 'Tutor sketch: electrodes over a strip of muscle; the depolarized part (−) on the left, resting part (+) on the right.', 'ekg', 1) + '</div>' +
        '<p class="note">Repolarization is the mirror image of depolarization: same direction of travel, opposite sign of the deflection.</p>' },
    { t: 'q', id: 'C1', src: 'i-RAT 266-66', core: true,
      q: 'Which of the following statements is true regarding the electrical vector of the ventricular action potential recorded by the potential difference between two electrodes?',
      o: ['During depolarization, the depolarization wave is a positive wave because the electrode placed in the depolarized area is relatively positive compared to the recording electrode in the polarized area.',
        'During depolarization, the depolarization wave is a positive wave because the electrode placed in the depolarized area is relatively negative compared to the recording electrode in the polarized area.',
        'During repolarization, the repolarization wave is a positive wave because the electrode placed in the repolarized area is relatively positive compared to the recording electrode in the depolarized area.',
        'During repolarization, the repolarization wave is a negative wave because the electrode placed in the repolarized area is relatively negative compared to the recording electrode in the depolarized area.'],
      a: 1,
      ex: 'The outside of depolarized cells is negative and the outside of resting cells is positive, so the electrode over the depolarized area is relatively negative. A depolarization wave heading toward the recording (+) electrode in resting tissue gives a positive wave. Repolarized tissue is outside-positive again, not negative, so the last two statements have the signs wrong.' },

    { t: 'c', id: 'C-C2', title: 'Which wave comes from which cells', src: 'Lab Direction p.1 · t-RAT 2569 · t-RAT 2568',
      html: '<div class="tblwrap"><table class="tbl"><thead><tr><th>Electrical event</th><th>Main current</th><th>What the ECG shows</th></tr></thead><tbody>' +
        '<tr><td>Atrial depolarization</td><td>phase 0 of atrial muscle</td><td>{{P wave}}</td></tr>' +
        '<tr><td>Ventricular depolarization (septum → apex → free walls)</td><td>{{fast Na⁺ influx}} (phase 0)</td><td>{{QRS complex}}</td></tr>' +
        '<tr><td>Ventricular repolarization</td><td>{{K⁺ efflux}} from ventricular myocytes (phase 3)</td><td>{{T wave}}</td></tr>' +
        '<tr><td>Atrial repolarization</td><td>K⁺ leaving atrial cells</td><td>no wave of its own: it {{overlaps the ventricular depolarization}}</td></tr>' +
        '</tbody></table></div>' +
        '<div class="cols2"><div class="mini art"><h4>Why atrial repolarization is invisible</h4><p>It is small and happens at the {{same time}} as the large ventricular complex, so the QRS hides it.</p></div>' +
        '<div class="mini ven"><h4>Size follows muscle mass</h4><p>The thin atria give a small P; the {{thick ventricles}} give the big QRS.</p></div></div>' +
        '<p class="trap">The SA node and AV node fire too: their tiny currents make {{no visible wave}}. The PR segment is the time the impulse spends crossing the AV node.</p>' },
    { t: 'q', id: 'C2', src: 't-RAT 2569', core: true,
      q: 'Why is the atrial repolarization wave not visible on the ECG?',
      o: ['Because it occurs too gradually to be detectable', 'Because it occurs too rapidly to be detectable', 'Because it overlaps with the ventricular depolarization wave', 'Because it overlaps with the ventricular repolarization wave'],
      a: 2,
      ex: 'Atrial repolarization happens while the ventricles depolarize, so the big QRS complex hides it. It is not too fast or too slow, and it is over long before the T wave.' },
    { t: 'q', id: 'C3', src: 't-RAT 2568',
      q: 'Which of the following ion movements is primarily responsible for the T wave observed on the ECG?',
      o: ['Na⁺ influx into ventricular myocytes', 'Na⁺ influx into atrial myocytes', 'K⁺ efflux from ventricular myocytes', 'K⁺ efflux from atrial myocytes'],
      a: 2,
      ex: 'The T wave is ventricular repolarization, phase 3, carried by K⁺ leaving ventricular myocytes. Na⁺ influx into ventricles makes the QRS; atrial K⁺ efflux is hidden in the QRS.' },
    { t: 'q', id: 'C4', src: 'AC77',
      q: 'Inhibiting fast Na Channel at ventricle, what is absent from EKG?',
      o: ['P wave', 'PR segment', 'QRS wave', 'ST segment', 'T wave'],
      a: 2,
      ex: 'Fast Na⁺ channels carry phase 0 of working ventricular muscle, which is the QRS. The P wave (atria) and the PR segment (AV node) do not depend on ventricular Na⁺ channels.',
      flag: 'The recall says "absent". Blocking ventricular fast Na⁺ channels in reality slows and widens the QRS rather than erasing it; the item tests the link phase 0 of ventricular muscle = QRS.' },

    { t: 'c', id: 'C-C3', title: 'Why the T wave points the same way as the QRS', src: 'Peer – EKG p.1–2 · i-RAT 266-66',
      html: '<div class="two"><div class="stack"><ol class="steps">' +
        '<li>Depolarization spreads from {{endocardium → epicardium}} (inside out).</li>' +
        '<li>Endocardial cells have the {{longer action potential}}; epicardial cells are activated later but finish first.</li>' +
        '<li>So repolarization runs the opposite way, {{epicardium → endocardium}} (outside in).</li>' +
        '<li>Opposite direction × opposite sign (C-C1 table) = the T wave has the {{same polarity}} as the QRS. This is called <b>{{concordant}}</b>.</li>' +
        '</ol>' +
        '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Normal T wave</th><th>Leads</th></tr></thead><tbody>' +
        '<tr><td>Upright</td><td>{{II, V3–V6}}</td></tr><tr><td>Inverted</td><td>{{aVR}}</td></tr></tbody></table></div></div>' +
        CVS.fig('peer-endoepi', 'Tutor sketch: endocardium is activated first (filled dots) but its action potential lasts longer than the epicardium’s.', 'ekg', 1) + '</div>' +
        '<p class="trap">"Repolarization is normally discordant" is the wrong option: a healthy T wave follows its QRS. A T wave that goes against the QRS points to disease.</p>' },
    { t: 'q', id: 'C5', src: 'i-RAT 266-66', core: true,
      q: 'Normally, the ventricular repolarization wave is concordant with the ventricular depolarization wave because of which of the following cardiac properties?',
      o: ['The action potential duration of the endocardial cells is longer than that of the epicardial cells.', 'The action potential duration of the epicardial cells is longer than that of the endocardial cells.', 'The action potential duration is similar in both the endocardial and the epicardial cells.', 'The repolarization wave is normally discordant with the depolarization wave because depolarization and repolarization occur in the same direction towards or away from the electrode.'],
      a: 0,
      ex: 'Endocardium depolarizes first but keeps a longer action potential, so epicardium repolarizes first. Repolarization therefore travels outside to inside, the reverse of depolarization, and the two reversals cancel: the T wave has the same polarity as the QRS.' },

    { t: 'c', id: 'C-C4', title: 'Action-potential phases on the tracing', src: 'Peer – EKG p.2 · t-RAT 2569 · i-RAT 266-66 · AC80',
      html: '<div class="tblwrap"><table class="tbl"><thead><tr><th>Ventricular action potential</th><th>Ion current</th><th>Where it sits on the ECG</th></tr></thead><tbody>' +
        '<tr><td>Phase 0, upstroke</td><td>fast Na⁺ in</td><td>{{QRS complex}}</td></tr>' +
        '<tr><td>Phase 2, plateau</td><td>Ca²⁺ in ≈ K⁺ out</td><td>{{ST segment}}: every ventricular cell is depolarized, so the line is isoelectric</td></tr>' +
        '<tr><td>Phase 3, repolarization</td><td>K⁺ out</td><td>{{T wave}}</td></tr>' +
        '<tr><td>Phase 4, rest</td><td>K⁺ leak (I<sub>K1</sub>)</td><td>{{TP segment}}</td></tr>' +
        '</tbody></table></div>' +
        '<div class="cols2"><div class="mini art"><h4>Atria run earlier</h4><p>Atrial phase 0 = P wave. Atrial phase 3 falls {{inside the QRS}}.</p></div>' +
        '<div class="mini ven"><h4>Refractory periods</h4><p>Absolute refractory period ≈ from the QRS through the {{whole plateau}} to about the peak of T. The second half of T is the {{relative}} refractory period.</p></div></div>' +
        '<p class="trap">Phase 4 is <b>not</b> the downslope after the plateau: that downslope is phase 3. Rest comes after it.</p>' },
    { t: 'q', id: 'C6', src: 't-RAT 2569', core: true,
      q: 'Which component of the ECG most likely corresponds to phase 4 of the action potential in ventricular muscle cells?',
      o: ['QRS complex', 'ST segment', 'T wave', 'TP segment'],
      a: 3,
      ex: 'Phase 4 is the resting potential between beats: the flat TP segment. QRS = phase 0, ST segment = phase 2 plateau, T wave = phase 3.' },
    { t: 'q', id: 'C7', src: 'i-RAT 266-66',
      q: 'Which of the following segments in the EKG most likely contains Phase 3 of the action potential in atrial muscles?',
      o: ['P wave', 'QRS complex', 'T wave', 'ST segment'],
      a: 1,
      ex: 'Atrial repolarization (atrial phase 3) happens while the ventricles depolarize, so it is buried in the QRS complex. The P wave is atrial phase 0; the T wave and ST segment belong to the ventricles.' },
    { t: 'q', id: 'C8', src: 'AC80',
      q: 'Which part of ECG wave is the absolute refractory period in a cardiac cycle?',
      o: ['P wave', 'PR interval', 'ST segment', 'T wave', 'RR interval'],
      a: 2,
      ex: 'The ventricular absolute refractory period lasts from phase 0 through the plateau into early phase 3. On the ECG that is the QRS and ST segment up to about the peak of T. The ST segment lies wholly inside it.',
      flag: 'Only the ST segment lies entirely within the absolute refractory period; the T wave is partly relative refractory. Teach the span (QRS → mid-T) rather than a single label.' }
  ]
});

/* Section W: Waves, intervals and segments.
   Sources: Lab Direction - ECG p.1, Peer - EKG p.1-2 (tutor notes, filled-in values), Peer - Physiology of the Heart p.2 (Wiggers sketch),
   ECG TBL t-RAT 2569 / 2568, i-RAT 266-66 (with key), AC75-79. Past-paper stems and options keep their original wording and order. */
CVS.add({
  id: 'W', short: 'Waves', title: 'Waves, intervals and segments', kind: 'Lecture',
  blurb: 'Naming the parts of the tracing, what each interval times, the normal values the exam checks, the ECG on the cardiac cycle, and what autonomic tone changes.',
  items: [
    { t: 'c', id: 'W-C1', title: 'Waves, segments and intervals', src: 'Lab Direction p.1 · t-RAT 2569 · t-RAT 2568',
      html: '<div class="two"><div class="stack"><ul class="pts">' +
        '<li><b>Wave</b>: a deflection away from baseline: P, Q, R, S, T, U.</li>' +
        '<li><b>Segment</b>: a {{flat stretch between two waves}}: the PR, ST and TP segments.</li>' +
        '<li><b>Interval</b>: a {{wave plus the segment after it}}. PR interval = start of P → start of QRS. QT interval = start of QRS → {{end of T}}.</li>' +
        '<li><b>PR segment</b> (end of P → QRS): the impulse is held in the {{AV node}}, so this stretch measures AV nodal delay.</li>' +
        '<li><b>ST segment</b>: the ventricles are all depolarized ({{plateau}}), so it sits on the isoelectric line.</li>' +
        '<li><b>Isoelectric line</b>: the baseline, best judged on the {{TP segment}} where the whole heart is at rest.</li>' +
        '</ul></div>' +
        CVS.fig('lab-waves', 'Fig 10-1: P, QRS, T and U waves; PR interval, PR segment, QRS duration, ST segment and QT interval. Calibration 10 mV mark at left.', 'lab', 1) + '</div>' +
        '<p class="trap">PR <i>interval</i> includes the P wave (atrial depolarization + nodal delay); PR <i>segment</i> is only the {{AV delay}} part.</p>' },
    { t: 'q', id: 'W1', src: 't-RAT 2568', core: true,
      q: 'A 12-lead ECG from a 40-year-old woman is shown below. Identify the ECG components labeled A and B, respectively.',
      fig: CVS.fig('t68-labels', 't-RAT 2568 Q8: arrows A (lead II) and B (lead V2).', 'ekg', 38),
      o: ['P wave, T wave', 'PR interval, TP segment', 'Q wave, ST segment', 'P wave, ST segment'],
      a: 3,
      ex: 'Arrow A points at the small hump before the QRS in lead II: the P wave. Arrow B points at the flat stretch just after the QRS in V2: the ST segment.' },
    { t: 'q', id: 'W2', src: 't-RAT 2569', core: true,
      q: 'A 2nd-year medical student is studying the effects of a cardiovascular drug. He obtains ECG recordings from healthy individuals and measures the duration of specific parts of the ECG. A lead II recording from a healthy individual is shown. A specific part of the recording is marked with “X”. Which of the following cardiac electrophysiological properties best explains the duration of the marked part in the recording?',
      fig: CVS.fig('t69-prseg', 't-RAT 2569 Q8: lead II with the part marked X.', 'ekg', 7),
      o: ['Transmission of the electrical impulse through the AV node', 'Atrial depolarization which corresponds to atrial conntraction', 'Interval between ventricular depolarization and repolarization', 'Ventricular depolarization which corresponds to ventricular systole'],
      a: 0,
      ex: 'X is the PR segment, from the end of the P wave to the start of the QRS. During it the impulse crosses the slow AV node, so its length is AV nodal delay. Atrial depolarization is the P wave itself; ventricular depolarization is the QRS.' },
    { t: 'q', id: 'W3', src: 't-RAT 2568',
      q: 'Which of the following correctly matches an ECG segment with the corresponding phase of the cardiac cycle?',
      o: ['P wave – Ventricular systole', 'PR interval – Atrial depolarization and AV nodal delay', 'QRS complex – Ventricular repolarization', 'ST segment – Ventricular filling'],
      a: 1,
      ex: 'The PR interval runs from the start of P (atrial depolarization) to the start of QRS, so it holds atrial depolarization plus AV nodal delay. The P wave precedes atrial, not ventricular, systole; QRS is depolarization; the ST segment falls in ventricular ejection, not filling.' },

    { t: 'c', id: 'W-C2', title: 'Intervals time the conduction', src: 'Peer – EKG p.2 (tutor notes) · i-RAT 266-66 key',
      html: '<div class="tblwrap"><table class="tbl"><thead><tr><th>Measure</th><th>What it times</th><th>Normal</th><th>Too short / too long</th></tr></thead><tbody>' +
        '<tr><td><b>PR interval</b></td><td>atria start → ventricles start (incl. AV node)</td><td>{{120–200 ms}}</td><td>&lt; 120: {{pre-excitation}} (impulse skips the AV node) · &gt; 200: {{1st-degree AV block}}</td></tr>' +
        '<tr><td><b>QRS width</b></td><td>ventricular depolarization</td><td>≤ {{100–110 ms}}</td><td>&lt; 120 ms; wider = slow ventricular conduction</td></tr>' +
        '<tr><td><b>QT interval</b></td><td>ventricles depolarize → finish repolarizing</td><td>QT ∝ RR ∝ 1/HR</td><td>shortens when the heart rate {{rises}}</td></tr>' +
        '<tr><td><b>QTc</b></td><td>QT corrected for heart rate: QT / √RR</td><td>{{330–440 ms}} (♀ up to {{450}})</td><td>QTc 500 ms = prolonged</td></tr>' +
        '</tbody></table></div>' +
        '<p class="note">Box count at 25 mm/s: 1 small box = 40 ms, so a normal PR = {{3–5}} small boxes and QRS ≤ 110 ms ≈ under 3 small boxes.</p>' +
        '<p class="trap">An AV-node conduction defect changes the {{P-to-QRS time}}, not the QT or ST.</p>' },
    { t: 'q', id: 'W4', src: 'i-RAT 266-66', core: true,
      q: 'Which of the following components in the EKG will be altered if there is a conduction defect of the atrioventricular node?',
      o: ['PR interval', 'QT interval', 'RR interval', 'ST segment'],
      a: 0,
      ex: 'The PR interval contains the AV nodal delay, so slower AV conduction lengthens it (PR > 200 ms = 1st-degree AV block). QT and ST belong to the ventricles; RR reflects the SA node rate.' },
    { t: 'q', id: 'W5', src: 'i-RAT 266-66', core: true,
      q: 'Regarding the EKG, which of the following findings is ABNORMAL?',
      o: ['QRS interval 100 msec', 'PR interval 100 msec', 'Heart rate 100 bpm with a sinus rhythm', 'Negative T wave in lead aVR'],
      a: 1,
      ex: 'PR 100 ms is shorter than 120 ms: the impulse reached the ventricles too early (pre-excitation). QRS 100 ms is normal, 100 bpm is the upper limit of normal sinus rate, and T is normally negative in aVR.' },

    { t: 'c', id: 'W-C3', title: 'Normal or not? The findings the exam checks', src: 'Peer – EKG p.2 · i-RAT 266-66 key · AC75–79',
      html: '<div class="two"><div class="tblwrap"><table class="tbl compact"><thead><tr><th>Finding</th><th>Normal</th><th>Abnormal example</th></tr></thead><tbody>' +
        '<tr><td>P wave polarity</td><td>{{upright in II}}, {{negative in aVR}}</td><td>negative P in II</td></tr>' +
        '<tr><td>T wave polarity</td><td>upright in V3–V6</td><td>—</td></tr>' +
        '<tr><td>ST segment</td><td>isoelectric, deviation within {{±1 mm}}</td><td>{{ST elevation 4 mm}}; depression 2 mm</td></tr>' +
        '<tr><td>Q wave</td><td>small q, width {{&lt; 40 ms}}</td><td>broad, deep Q: old {{myocardial infarction}}</td></tr>' +
        '<tr><td>PR · QRS · QT</td><td>PR 160 ms · QRS 100 ms · QTc 330–440</td><td>PR 240 · QRS 140 · QT 140 · QTc 500</td></tr>' +
        '<tr><td>RR interval</td><td>{{600–1000 ms}} (60–100 bpm)</td><td>RR 500 ms = {{120 bpm}}</td></tr>' +
        '<tr><td>QRS axis</td><td>−30° to +90°, so 30° is {{inside the range}}</td><td>see section A</td></tr>' +
        '</tbody></table></div>' +
        CVS.fig('peer-st-elev', 'ST segment elevation: the segment after the QRS sits well above the baseline (dashed lines).', 'ekg', 2) + '</div>' +
        '<p class="trap">Convert RR to rate before judging it: HR = 60 000 ÷ RR (ms). RR 800 ms = 75 bpm (normal).</p>' },
    { t: 'q', id: 'W6', src: 'i-RAT 266-66', core: true,
      q: 'Regarding the EKG, which of the following findings is normal?',
      o: ['Negative P wave in lead aVR', 'QTc interval 500 msec', 'RR interval 500 msec', 'ST segment depression 2 mm'],
      a: 0,
      ex: 'aVR looks at the heart from the right shoulder, so the normal P (and QRS and T) is negative there. QTc 500 ms is prolonged, RR 500 ms means 120 bpm, and ST depression of 2 mm is beyond ±1 mm.' },
    { t: 'q', id: 'W7', src: 'AC77',
      q: 'Which of the following is normal EKG?',
      o: ['PR interval 240 ms', 'QT interval 140 ms', 'Negative P wave in Lead II', 'Negative P wave in Lead VR', 'RR interval 500 ms'],
      a: 3,
      ex: 'A negative P in aVR is normal sinus rhythm. PR 240 ms is a 1st-degree AV block, QT 140 ms is far too short, a negative P in lead II means the impulse is not coming from the SA node, and RR 500 ms is 120 bpm.' },
    { t: 'q', id: 'W8', src: 'AC78',
      q: 'Which of the following is a normal EKG pattern?',
      o: ['PR Interval 240 msec', 'QRS wave 140 msec', 'Positive T wave in leadV3', 'RR interval 500 msec', 'Negative P wave in lead II'],
      a: 2,
      ex: 'T waves are normally upright in V3–V6. PR 240 ms is prolonged, QRS 140 ms is wide, RR 500 ms is tachycardia, and a negative P in lead II is not sinus.' },
    { t: 'q', id: 'W9', src: 'AC75', core: true,
      q: 'Abnormal EKG?',
      o: ['Positive P lead II (positive t?)', 'Negative P aVR', 'PR interval 120-200 msec', 'QRS width 60-110 msec', 'Broad Q & high altitude'],
      a: 4,
      ex: 'A broad (> 40 ms), deep Q wave marks an old myocardial infarction. The other four are the normal findings: P upright in II and negative in aVR, PR 120–200 ms, QRS up to 110 ms.',
      flag: 'Recall wording. "High altitude" most likely means high amplitude (a deep Q), and "(positive t?)" shows the writer was unsure whether option A said P or T; both are normal in lead II.' },
    { t: 'q', id: 'W10', src: 'AC79',
      q: 'What is abnormal EKG?',
      o: ['PR interval 160 msec', 'QRS 100 msec', 'ST segment elevated 4 mm', 'RR interval 800 msec', 'QRS axis 30 องศา <span class="muted">(30 degrees)</span>'],
      a: 2,
      ex: 'The ST segment should stay within ±1 mm of the baseline; 4 mm of elevation is abnormal (acute injury). PR 160 ms, QRS 100 ms, RR 800 ms (75 bpm) and an axis of 30° are all normal.' },
    { t: 'q', id: 'W11', src: 'AC79',
      q: 'Which of the following considered as an abnormal ECG finding',
      o: ['RR interval 800 msec', 'PR interval 160 msec', 'ST segment elevation 4 mm', 'QRS interval 100 msec', 'QRS axis 30'],
      a: 2,
      ex: 'Same item as W10 with the options reordered: only the 4 mm ST elevation is outside normal limits.' },

    { t: 'c', id: 'W-C4', title: 'The ECG on the cardiac cycle', src: 'Peer – Physiology of the Heart p.2 · t-RAT 2569 · t-RAT 2568 · AC75–77',
      html: '<div class="two"><div class="stack"><p>Electrical events come first; each wave {{precedes}} the contraction it triggers.</p>' +
        '<div class="flow col">' +
        '<div class="fbox start"><b>P wave</b> → {{atrial contraction}} (the atrial kick at the end of filling)</div><div class="farrow">↓</div>' +
        '<div class="fbox art"><b>QRS</b> → ventricles contract: AV valves close ({{S1}}), {{isovolumic contraction}}, then the aortic valve opens just after the QRS</div><div class="farrow">↓</div>' +
        '<div class="fbox art"><b>ST · T</b> → ejection (rapid, then reduced during T)</div><div class="farrow">↓</div>' +
        '<div class="fbox ven"><b>End of T</b> → aortic valve closes ({{S2}}) → {{isovolumic relaxation}}</div><div class="farrow">↓</div>' +
        '<div class="fbox ven"><b>Early TP segment</b> → mitral valve opens → {{rapid filling}}: the largest flow across the mitral valve</div>' +
        '</div></div>' +
        CVS.fig('peer-wiggers', 'Tutor’s Wiggers sketch: aortic, LV and LA pressure, LV volume and the ECG trace, with the phases labelled underneath.', 'heart', 2) + '</div>' },
    { t: 'q', id: 'W12', src: 'AC75, AC77', core: true,
      q: 'Which of the following occurred after P wave in EKG test?',
      o: ['Atrial contraction', 'Ventricular filling', 'Ventricular contraction', 'Isovolumic relaxation', 'Isovolumic contraction'],
      a: 0,
      ex: 'The P wave is atrial depolarization, and the atria contract right after it. Ventricular contraction and isovolumic contraction follow the QRS; isovolumic relaxation follows the T wave.' },
    { t: 'q', id: 'W13', src: 'AC76',
      q: 'Which of the following event occurs just after the T wave?',
      o: ['Atrial contraction', 'Decreased ventricular filling', 'Decreased ventricular ejection', 'Isovolumetric relaxation', 'Closure of mitral valve'],
      a: 3,
      ex: 'The T wave ends ventricular repolarization; the aortic valve closes (S2) and the ventricle relaxes with all valves shut: isovolumetric relaxation. Reduced ejection happens during the T wave; atrial contraction follows the next P; the mitral valve closes at the QRS.' },
    { t: 'q', id: 'W14', src: 't-RAT 2568',
      q: 'The opening of the aortic valve corresponds most closely to which component of the ECG?',
      o: ['P wave', 'QRS complex', 'PR interval', 'T wave'],
      a: 1,
      ex: 'The QRS starts ventricular contraction; once LV pressure passes aortic pressure (end of isovolumic contraction) the aortic valve opens, right at the end of the QRS. The T wave is near aortic valve closure.',
      flag: 'Strictly the valve opens just after the QRS, around the start of the ST segment. Among the options the QRS complex is the closest.' },
    { t: 'q', id: 'W15', src: 't-RAT 2569', core: true,
      q: 'ECG below is obtained from a 52-year-old healthy man. Blood flow across the mitral valve is largest around which indicated point on this ECG tracing?',
      fig: CVS.fig('t69-mitral', 't-RAT 2569 Q5: points A–D marked on one cardiac cycle.', 'ekg', 6),
      o: ['A', 'B', 'C', 'D'],
      a: 3,
      ex: 'Point D, just after the T wave, is early diastole: the mitral valve has opened and rapid ventricular filling carries the largest flow. B (the P wave) only leads to the smaller atrial kick; C is during ejection when the mitral valve is shut.' },

    { t: 'c', id: 'W-C5', title: 'Autonomic tone changes the timing', src: 'i-RAT 266-66 key · t-RAT 2569 · AC79',
      html: '<div class="cols2"><div class="mini art"><h4>Sympathetic up · or atropine (vagus blocked)</h4><ul>' +
        '<li>SA node fires faster → {{RR interval shortens}} (HR up)</li>' +
        '<li>AV node conducts faster → PR gets shorter</li>' +
        '<li>QT ∝ RR → QT {{shortens}}</li>' +
        '<li>QRS width {{unchanged}}: ventricular conduction is not autonomic</li></ul></div>' +
        '<div class="mini ven"><h4>Vagus up (acetylcholine on M₂)</h4><ul>' +
        '<li>SA node slower → RR {{lengthens}}</li>' +
        '<li>AV node slower → PR {{lengthens}}</li>' +
        '<li>Strong vagal effect → AV block or a pause</li></ul></div></div>' +
        '<p class="note">To see a drug act on the SA node, measure the {{RR interval}}, which is the heart rate.</p>' +
        '<p class="trap">ST elevation is not an autonomic effect: it means {{myocardial injury}}. QRS amplitude does not grow with sympathetic tone.</p>' },
    { t: 'q', id: 'W16', src: 'i-RAT 266-66',
      q: 'What would be the expected change to the EKG of a person with an increase in the sympathetic tone?',
      o: ['An increase in the R-R interval', 'An increase in the amplitude of the QRS complex', 'A shortened QT interval', 'A narrower QRS complex'],
      a: 2,
      ex: 'Sympathetic tone raises the heart rate, so RR falls, and QT shortens with it (QT ∝ RR). It does not make the QRS taller or narrower.' },
    { t: 'q', id: 'W17', src: 't-RAT 2569', core: true,
      q: 'Which of the following changes to the ECG does NOT occur in a person who is given a muscarinic antagonist?',
      o: ['Unchanged QRS interval', 'Decreased RR interval', 'Decreased QT interval', 'Elevated ST segment'],
      a: 3,
      ex: 'Blocking muscarinic receptors removes vagal brake: HR up (RR down), QT down with RR, QRS width unchanged. ST elevation is a sign of myocardial injury, not of a muscarinic blocker.' },
    { t: 'q', id: 'W18', src: 'AC79',
      q: 'ให้ atropine ไปที่ SA node check ผลที่ไหนของ EKG<br><span class="muted">Atropine is given to act on the SA node. Where on the EKG do you check its effect?</span>',
      o: ['RR interval', 'QT interval', 'ST segment', 'PR interval', 'QRS comple'],
      a: 0,
      ex: 'The SA node sets the heart rate, which the ECG shows as the RR interval: atropine shortens it. PR reflects the AV node, QT and ST the ventricles.' }
  ]
});

/* Section L: Leads, the hexaxial reference system and swapped electrodes.
   Sources: Lab Direction - ECG p.2, Peer - EKG p.1-2 (tutor notes), ECG TBL t-RAT 2569 / 2568, i-RAT 266-66, AC78-81.
   Past-paper stems and options keep their original wording and order. */
CVS.add({
  id: 'L', short: 'Leads', title: 'Limb leads, the hexaxial wheel and swapped electrodes', kind: 'Lecture',
  blurb: 'Which electrodes make leads I, II and III, where aVR, aVL and aVF point, which leads are perpendicular, and what each electrode swap does.',
  items: [
    { t: 'c', id: 'L-C1', title: 'Bipolar limb leads (Einthoven)', src: 'Lab Direction p.2 · Peer – EKG p.1',
      html: '<div class="two"><div class="stack"><div class="tblwrap"><table class="tbl"><thead><tr><th>Lead</th><th>+ electrode</th><th>− electrode</th><th>Angle</th></tr></thead><tbody>' +
        '<tr><td><b>I</b></td><td>{{LA}}</td><td>{{RA}}</td><td>0°</td></tr>' +
        '<tr><td><b>II</b></td><td>{{LL}}</td><td>RA</td><td>{{+60°}}</td></tr>' +
        '<tr><td><b>III</b></td><td>LL</td><td>{{LA}}</td><td>{{+120°}}</td></tr>' +
        '</tbody></table></div>' +
        '<ul class="pts"><li>Each bipolar lead uses {{two limb electrodes}}; the right leg (RL) electrode is the {{ground}} and is in no lead.</li>' +
        '<li>Leads I, II and III form Einthoven’s triangle: {{II = I + III}}.</li>' +
        '<li>A lead points from its − electrode toward its + electrode: lead I points {{horizontally to the left}}, II down-left, III down-right.</li></ul></div>' +
        CVS.fig('peer-bipolar', 'Tutor sketch: lead I at 0°, with leads II and III each 60° below it.', 'ekg', 1) + '</div>' +
        '<p class="trap">Only one bipolar lead uses the left arm as its <i>negative</i> pole: “left arm and left leg” = {{lead III}}.</p>' },
    { t: 'q', id: 'L1', src: 't-RAT 2569',
      q: 'When recording lead II on an ECG, where is the positive electrode placed?',
      o: ['Left arm', 'Right arm', 'Left leg', 'Right leg'],
      a: 2,
      ex: 'Lead II runs from the right arm (−) to the left leg (+), pointing down-left at +60°.' },
    { t: 'q', id: 'L2', src: 't-RAT 2568',
      q: 'When recording Lead II on a standard 12-lead ECG, where are the positive and negative electrodes placed, respectively?',
      o: ['Right arm and left arm', 'Right arm and left leg', 'Left arm and left leg', 'Left leg and right arm'],
      a: 3,
      ex: 'Positive first: left leg (+), right arm (−). The second option has the right pair in the wrong order.' },
    { t: 'q', id: 'L3', src: 'i-RAT 266-66', core: true,
      q: 'Which of the following leads requires electrode placements at the left arm and the left foot?',
      o: ['Lead I', 'Lead II', 'Lead III', 'Lead aVL'],
      a: 2,
      ex: 'Lead III = left leg (+) versus left arm (−). Lead I uses both arms, lead II right arm and left leg; aVL is an augmented lead with its + pole on the left arm.' },
    { t: 'q', id: 'L4', src: 'AC79',
      q: 'what is the location of lead III?',
      o: ['Right arm and right leg', 'Right arm and left arm', 'Left arm and left leg', 'Right arm and left leg', 'Left arm and right leg'],
      a: 2,
      ex: 'Lead III joins the left arm (−) and the left leg (+). The right leg is only the ground.' },
    { t: 'q', id: 'L5', src: 't-RAT 2568', core: true,
      q: 'A medical student wears a smart watch on the left wrist and activates the ECG feature by placing the right index finger on the digital crown, as shown in the figure below. The watch contains a positive electrode on the back that contacts the left wrist, and the crown functions as a negative electrode. Which standard ECG lead is most closely represented by this configuration?',
      fig: CVS.fig('t68-watch', 't-RAT 2568 Q4: watch on the left wrist, right index finger on the crown.', 'ekg', 37),
      o: ['Lead I', 'Lead II', 'Lead III', 'Lead aVR'],
      a: 0,
      ex: 'Positive on the left arm, negative on the right arm: that is lead I, pointing at 0°.' },

    { t: 'c', id: 'L-C2', title: 'Augmented leads and the hexaxial wheel', src: 'Peer – EKG p.1–2 · i-RAT 266-66 · AC78',
      html: '<div class="two"><div class="stack"><ul class="pts">' +
        '<li><b>Augmented (unipolar) limb leads</b>: one limb is +, compared with the average of the other two. aVR: + on the {{right arm}}. aVL: + on the {{left arm}}. aVF: + on the {{left foot}}.</li>' +
        '<li>Angles: aVL {{−30°}}, aVF {{+90°}}, aVR {{−150°}}.</li>' +
        '<li>Put the six limb leads on one wheel and they sit every <b>30°</b>: the hexaxial reference system (frontal plane only; chest leads are the horizontal plane).</li></ul>' +
        '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Lead</th><th>Perpendicular partner (90° apart)</th></tr></thead><tbody>' +
        '<tr><td>I (0°)</td><td>{{aVF (+90°)}}</td></tr><tr><td>II (+60°)</td><td>{{aVL (−30°)}}</td></tr><tr><td>III (+120°)</td><td>{{aVR (−150°)}}</td></tr></tbody></table></div></div>' +
        '<div class="stack">' + CVS.fig('peer-augmented', 'Tutor sketch: aVR and aVL 30° above the horizontal, aVF straight down.', 'ekg', 1) +
        CVS.fig('peer-hex3d', 'The six frontal-plane leads around the chest: aVR, aVL, I, II, aVF and III.', 'ekg', 2) + '</div></div>' +
        '<p class="trap">Perpendicular pairs pair a bipolar lead with an augmented lead: memorise I–aVF, II–aVL, III–aVR.</p>' },
    { t: 'q', id: 'L6', src: 'i-RAT 266-66', core: true,
      q: 'The electrical vector of which lead is perpendicular to the vector of lead aVR in the frontal plane axis?',
      o: ['Lead I', 'Lead II', 'Lead III', 'Lead aVL'],
      a: 2,
      ex: 'aVR points to −150°; 90° from it is +120° (or −60°), which is lead III.' },
    { t: 'q', id: 'L7', src: 'AC78',
      q: 'Which lead is perpendicular to lead aVL?',
      o: ['Lead I', 'Lead II', 'Lead III', 'Lead aVR', 'Lead aVF'],
      a: 1,
      ex: 'aVL points to −30°; 90° away is +60°, which is lead II.' },

    { t: 'c', id: 'L-C3', title: 'Swapped limb electrodes', src: 'Peer – EKG p.1–2 · AC80 · AC81 · TBL RATs',
      html: '<div class="two"><div class="tblwrap"><table class="tbl compact"><thead><tr><th>Swap</th><th>What the tracing does</th><th>Lead left unchanged</th></tr></thead><tbody>' +
        '<tr><td><b>RA ↔ LA</b> (commonest)</td><td>lead I {{upside down (−I)}}; II ↔ III; aVR ↔ aVL</td><td>{{aVF}}</td></tr>' +
        '<tr><td><b>RA ↔ LL</b></td><td>II inverted; I and III swap and invert; aVR ↔ aVF</td><td>{{aVL}}</td></tr>' +
        '<tr><td><b>LA ↔ LL</b></td><td>III inverted; I ↔ II; aVL ↔ aVF</td><td>{{aVR}}</td></tr>' +
        '<tr><td><b>LL ↔ RL</b></td><td>{{almost no change}}: RL is only the ground and both legs sit at nearly the same potential</td><td>all</td></tr>' +
        '</tbody></table></div>' +
        CVS.fig('peer-swap', 'Tutor sketch: swapping the arm electrodes turns lead I upside down (I becomes −I).', 'ekg', 1) + '</div>' +
        '<p class="note">Rule of thumb: the unchanged lead is the augmented lead of the {{limb that was not moved}}.</p>' +
        '<p class="trap">“Where does the aVF tracing show up after an arm swap?” Still in {{aVF}}: nothing touched the left leg.</p>' },
    { t: 'q', id: 'L8', src: 'AC80', core: true,
      q: 'During an ECG test on a patient, the physician accidentally swaps a pair of leads. However, the aVF waveform is not affected by this mistake, while the rest of the waveforms are incorrect. The leads of which extremities have been swapped?',
      o: ['Left arm and left leg', 'Left arm and right leg', 'Right arm and left arm', 'Right arm and left leg', 'Right arm and right leg'],
      a: 2,
      ex: 'aVF is the left-leg lead, so it stays correct only if the left leg was not moved: the two arms were swapped. That also inverts lead I and swaps II with III and aVR with aVL.' },

CVS.add({

    { t: 'c', id: 'R-C1', title: 'ECG paper and the 1500 rule', src: 'Peer – EKG p.1–2 (tutor notes) · i-RAT 266-66 key',

      q: 'RR interval 15 mm หา heart rate (ความเร็วกระดาษ 25 mm/s)?<br><span class="muted">RR interval 15 mm: find the heart rate (paper speed 25 mm/s).</span>',

    { t: 'c', id: 'R-C2', title: 'When the paper runs at another speed', src: 'Peer – EKG p.1–2 (tutor notes) · i-RAT 266-66 key · AC76 · AC80 · AC81',
      html: '<p>The 1500 rule assumes 25 mm/s. For any speed, count the boxes first, then correct:</p>' +
        '<p class="eqn"><span>HR = 1500 ÷ small boxes × <b>speed ÷ 25</b></span><span>= 60 × speed (mm/s) ÷ RR (mm)</span></p>' +

/* Short concept cards: each card's body is written here as arrow chains and brief bullets.
   Loaded last (data/sections.json), so it rebuilds the html of every card listed below.
   The card's figures and flow widgets are taken from its original html in the section file;
   the text there is superseded. Block syntax (one string per block):
     '> A → B → C'      cause → effect chain          '- text'   bullet (consecutive bullets form one list)
     '## Heading'        small group label            '! text'   exam trap / past-paper note
     '| a | b |'         table row (first row = head)  '= text'   centered equation
     '@F1' '@F2'         place that figure here; figures not placed go to a column beside the text
     '@X1'               place that flow widget        {{...}}    cloze blank (keep 3–8 per card, key ideas only)
     '---'               what follows goes full width under the text and figure columns */
(function () {
  var C = window.CVS, byId = {};
  C.sections.forEach(function (s) { s.items.forEach(function (it) { byId[it.id] = it; }); });
  function inl(t) { return C.cloze(String(t)).replace(/(→|↔|⇄)/g, '<span class="lt-ar">$1</span>'); }
  function render(blocks, F, X) {
    var out = [], main = out, below = null, ul = null, tb = null, used = {};
    function flush() {
      if (ul) { out.push('<ul class="lt-pts">' + ul.join('') + '</ul>'); ul = null; }
      if (tb) {
        out.push('<div class="tblwrap"><table class="lt-tbl"><thead><tr>' + tb[0].map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
          tb.slice(1).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inl(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>');
        tb = null;
      }
    }
    blocks.forEach(function (b) {
      b = b.replace(/<(?![A-Za-z\/!])/g, '&lt;');  /* a bare < (as in "< 80") is text, not a tag */
      var k = b.slice(0, 2), t = b.slice(2);
      if (k === '- ') { if (tb) flush(); (ul = ul || []).push('<li>' + inl(t) + '</li>'); return; }
      if (b[0] === '|') { if (ul) flush(); (tb = tb || []).push(b.replace(/^\|\s*|\s*\|\s*$/g, '').split(/\s*\|\s*/)); return; }
      flush();
